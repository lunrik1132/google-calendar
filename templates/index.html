<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google календар</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ceeaff;
            color: rgb(0, 0, 0);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 0;
        }

        .card {
            background: #ceeaff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .event-info {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 15px 10px 15px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btns {
            margin-left: 5px;
            
        }
        
        .btn-delete {
            background-color: rgb(243, 176, 176);
        }

        .btn-edit {
            background-color: #e0e0e0;
            margin-bottom: 5px;
        }

        .event {
            background: #f3f8ff;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            display: flex;
        }

        a {
            color: #93c5fd;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h2>Події</h2>
        <div id="events"></div>
    </div>
</div>

<script>

function login() {
    window.location.href = "/login";
}

function logout() {
    window.location.href = "/logout";
}

async function loadEvents() {
    const res = await fetch("/events");
    const data = await res.json();

    if (data.error === "auth_expired") { window.location.href = "/login"; }

    const container = document.getElementById("events");
    container.innerHTML = "";

    if (!Array.isArray(data)) {
        container.innerHTML = "<p>Помилка</p>";
        return;
    }

    if (data.length === 0) {
        container.innerHTML = "<p>Нічого не знайдено</p>";
        return;
    }

    data.forEach(ev => {
        const div = document.createElement("div");
        div.className = "event";
        
        if (ev.summary != "День рождения"){
            div.innerHTML = `
            <div class = event-info>
                <b>${ev.summary || ""}</b><br>
                🕒 ${ev.start || ""}<br>
                📝 ${ev.description || ""}</div>
            <div class=btns>
                <button class=btn-edit>Редагувати</button>
                <button class=btn-delete>Видалити</button>
                </div>
            `;
    
            container.appendChild(div);
        }
    });
}

// checkStatus();
loadEvents();
</script>

</body>
