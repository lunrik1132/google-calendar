<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google календар</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ceeaff;
            color: rgb(0, 0, 0);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 0;
        }

        .card {
            background: #ceeaff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .event-info {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 15px 10px 15px 10px;
            border: none;
            box-sizing: border-box;
            border-radius: 8px;
            cursor: pointer;
        }

        .btns {
            margin-left: 5px;
            
        }
        
        .btn-delete {
            background-color: rgb(243, 176, 176);
        }

        .btn-edit {
            background-color: #e0e0e0;
            margin-bottom: 5px;
        }
        .btn-create{
            background-color: #82eb82;
            font-size: large;
            padding: 10px;
        }
        .btn-logout{
            background-color:#ff6b6b; 
            color:white;
            width: fit-content;
        }

        .event {
            background: #f3f8ff;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            display: flex;
        }

        a {
            color: #93c5fd;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            min-width: 250px;
        }

        .modal-buttons {
            margin-top: 15px;
        }

        .modal-buttons button {
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .modal-content input,
        .modal-content textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <p>Видалити подію?</p>
        <div class="modal-buttons">
            <button onclick="confirmDelete()" class="btn-delete" style="background-color: #9b1212; color: white; font-size: large;">Так</button>
            <button onclick="closeModal()">Скасувати</button>
        </div>
    </div>
</div>

<div id="editModal" class="modal hidden">
    <div class="modal-content">
        <h3>Редагувати подію</h3>

        <input id="editTitle" placeholder="Назва"><br><br>
        <input id="editDate" type="date"><br><br>
        <textarea id="editDesc" placeholder="Опис"></textarea><br><br>

        <div class="modal-buttons">
            <button onclick="confirmEdit()" style="background-color: #00c000; color: white; font-size: large;">Зберегти</button>
            <button onclick="closeEditModal()">Скасувати</button>
        </div>
    </div>
</div>

<div id="createModal" class="modal hidden">
    <div class="modal-content">
        <h3>Створити подію</h3>

        <input id="createTitle" placeholder="Назва"><br><br>
        <input id="createDate" type="date"><br><br>
        <textarea id="createDesc" placeholder="Опис"></textarea><br><br>

        <div class="modal-buttons">
            <button onclick="confirmCreate()" style="background-color: #00c000; color: white; font-size: large;">
                Створити
            </button>
            <button onclick="closeCreateModal()">Скасувати</button>
        </div>
    </div>
</div>
<body>

<div class="container">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Події</h2>
            <button onclick="logout()" class="btn-logout">
                Вийти
            </button>
        </div>
        <div>
            <button class="btn-create" onclick="openCreateModal()">Створити</button>
        </div>
        <div id="events"></div>
    </div>
</div>

<script>

let eventToDelete = null;
let eventToEdit = null;

function openModal(id) {
    eventToDelete = id;
    document.getElementById("modal").classList.remove("hidden");
}

function closeModal() {
    eventToDelete = null;
    document.getElementById("modal").classList.add("hidden");
}


function login() {
    window.location.href = "/login";
}

async function logout() {
    window.location.href = "/login";
}

async function loadEvents() {
    const res = await fetch("/events");
    const data = await res.json();

    if (data.error === "auth_expired") { window.location.href = "/login"; }

    const container = document.getElementById("events");
    container.innerHTML = "";

    if (!Array.isArray(data)) {
        container.innerHTML = "<p>Помилка</p>";
        return;
    }

    if (data.length === 0) {
        container.innerHTML = "<p>Нічого не знайдено</p>";
        return;
    }

    data.forEach(ev => {
        const div = document.createElement("div");
        div.className = "event";
        
        if (ev.summary != "День рождения"){
            div.innerHTML = `
            <div class = event-info>
                <b>${ev.summary || ""}</b><br>
                🕒 ${ev.start || ""}<br>
                📝 ${ev.description || ""}</div>
            <div class=btns>
                <button class=btn-edit onclick='openEditModal(${JSON.stringify(ev)})'>Редагувати</button>
                <button class=btn-delete onclick="openModal('${ev.id}')">Видалити</button>
                </div>
            `;
    
            container.appendChild(div);
        }
    });
}

async function confirmDelete() {
    if (!eventToDelete) return;

    const res = await fetch(`/events/${eventToDelete}`, {
        method: "DELETE"
    });

    const data = await res.json();

    if (data.error) {
        alert("Помилка при видаленні");
    }

    closeModal();
    loadEvents();
}

function openEditModal(event) {
    eventToEdit = event;

    document.getElementById("editTitle").value = event.summary || "";
    document.getElementById("editDate").value = formatDateForInput(event.start);
    document.getElementById("editDesc").value = event.description || "";

    document.getElementById("editModal").classList.remove("hidden");
}

function closeEditModal() {
    eventToEdit = null;
    document.getElementById("editModal").classList.add("hidden");
}

function formatDateForInput(dateStr) {
    const [d, m, y] = dateStr.split("-");
    return `${y}-${m}-${d}`;
}

async function confirmEdit() {
    if (!eventToEdit) return;

    const updated = {
        summary: document.getElementById("editTitle").value,
        date: document.getElementById("editDate").value,
        description: document.getElementById("editDesc").value
    };

    const res = await fetch(`/events/${eventToEdit.id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(updated)
    });

    const data = await res.json();

    if (data.error) {
        alert("Помилка при редагуванні");
    }

    closeEditModal();
    loadEvents();
}

function openCreateModal() {
    document.getElementById("createModal").classList.remove("hidden");
}

function closeCreateModal() {
    document.getElementById("createModal").classList.add("hidden");
}

async function confirmCreate() {
    const newEvent = {
        summary: document.getElementById("createTitle").value,
        date: document.getElementById("createDate").value,
        description: document.getElementById("createDesc").value
    };

    const res = await fetch("/events", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(newEvent)
    });

    const data = await res.json();

    if (data.error) {
        alert("Помилка при створенні");
        return;
    }

    closeCreateModal();
    loadEvents();
}

loadEvents();
</script>

</body>
</html>
